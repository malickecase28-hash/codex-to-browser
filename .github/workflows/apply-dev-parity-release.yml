name: apply-dev-parity-release
# One-shot verifier for evidence-driven integration recovery and revisions.

on:
  push:
    branches:
      - chatgpt-dev-orchestrator
    paths:
      - ".github/workflows/apply-dev-parity-release.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt-dev-orchestrator
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node and Python development dependencies
        run: |
          npm --prefix packages/node ci
          python -m pip install -e "packages/python[dev]"

      - name: Apply durable integration recovery wiring
        run: |
          python .github/scripts/apply_integration_blocker_recovery.py
          python .github/scripts/fix_integration_blocker_test_import.py
          python .github/scripts/fix_integration_action_identity.py
          python .github/scripts/fix_integration_test_feedback.py

      - name: Build once and regenerate checked-in contract fixtures
        working-directory: packages/node
        run: |
          npm run build
          npm run contract:generate

      - name: Run focused integration recovery and durability tests
        working-directory: packages/node
        run: |
          npx vitest run \
            tests/unit/dev-autonomous-workflow.test.ts \
            tests/unit/dev-autonomous-engine.test.ts \
            tests/unit/dev-autonomous-api.test.ts \
            tests/unit/dev-backend-dispatch.test.ts \
            tests/unit/dev-autonomous-chatgpt-port.test.ts \
            tests/unit/dev-autonomous-local-action-store.test.ts \
            tests/unit/dev-codex-cli-local-recovery.test.ts \
            tests/unit/dev-codex-cli-local-port.test.ts \
            tests/unit/dev-autonomous-store.test.ts \
            tests/unit/surface-drift.test.ts \
            tests/unit/parity-suite.test.ts

      - name: Run focused Python dev parity tests
        working-directory: packages/python
        run: python -m unittest tests.test_dev_client

      - name: Run complete Node suite and bundles
        working-directory: packages/node
        run: |
          npm test
          npm run bundle
          npm run bundle:backend
          npm run bundle:live-smoke
          npm run bundle:release-canary

      - name: Verify Node contracts and parity
        working-directory: packages/node
        run: |
          npm run contract:validate
          npm run docs:drift
          npm run parity:fixtures
          npm run parity:suite
          npm run test:backend-conformance
          npm audit

      - name: Run complete Python parity suite
        working-directory: packages/python
        run: |
          python -m unittest discover -s tests
          python -m compileall -q src
          python -m compileall -q examples
          python -m pyright src tests

      - name: Rebuild and verify checked-in plugin runtime
        run: |
          npm run plugin:build
          npm run plugin:validate
          npm run plugin:check
          git diff --check

      - name: Commit verified integration recovery source and generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated/source changes to commit"
            exit 0
          fi
          git commit -m "feat: persist evidence-driven integration recovery"
          git push origin HEAD:chatgpt-dev-orchestrator
