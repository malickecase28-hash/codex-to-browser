name: harden-dev-delete-confirmation

on:
  push:
    branches:
      - chatgpt-dev-orchestrator
    paths:
      - ".github/workflows/harden-dev-delete-confirmation.yml"

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt-dev-orchestrator
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json

      - name: Install Node dependencies
        run: npm --prefix packages/node ci

      - name: Require caller confirmation for destructive dev deletes
        run: python .github/scripts/harden_dev_delete_confirmation.py

      - name: Verify focused destructive-confirmation tests and type build
        working-directory: packages/node
        run: |
          npx vitest run tests/unit/dev-orchestrator.test.ts
          npm run build

      - name: Run full Node deterministic suite
        working-directory: packages/node
        run: npm test

      - name: Rebuild and verify generated plugin runtime
        run: |
          npm run plugin:build
          npm run plugin:validate
          npm run plugin:check
          git diff --check

      - name: Commit verified safety hardening and generated bundles
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/node/src/dev/types.ts packages/node/src/dev/orchestrator.ts packages/node/tests/unit/dev-orchestrator.test.ts plugins/codex-chatgpt-control/runtime
          git commit -m "fix: require confirmation for destructive dev deletes"
          git push origin HEAD:chatgpt-dev-orchestrator
