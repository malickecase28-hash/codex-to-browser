name: version-0.6.0-alpha.1

on:
  push:
    branches:
      - chatgpt-dev-orchestrator
    paths:
      - ".github/workflows/version-0.6.0-alpha.1.yml"

permissions:
  contents: write

jobs:
  bump-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt-dev-orchestrator
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json

      - name: Apply coordinated prerelease version
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const rootPath = 'package.json';
          const root = JSON.parse(fs.readFileSync(rootPath, 'utf8'));
          root.version = '0.6.0-alpha.1';
          fs.writeFileSync(rootPath, `${JSON.stringify(root, null, 2)}\n`);
          NODE

          npm --prefix packages/node version 0.6.0-alpha.1 --no-git-tag-version --allow-same-version

          python - <<'PY'
          from pathlib import Path
          import json

          pyproject = Path('packages/python/pyproject.toml')
          py = pyproject.read_text(encoding='utf-8')
          old = 'version = "0.5.1a3"'
          if py.count(old) != 1:
              raise SystemExit('unexpected Python version site')
          pyproject.write_text(py.replace(old, 'version = "0.6.0a1"', 1), encoding='utf-8')

          plugin_path = Path('plugins/codex-chatgpt-control/.codex-plugin/plugin.json')
          plugin = json.loads(plugin_path.read_text(encoding='utf-8'))
          plugin['version'] = '0.6.0-alpha.1+codex.20260904182500'
          plugin_path.write_text(json.dumps(plugin, indent=2) + '\n', encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          heading = '# Changelog\n'
          if not text.startswith(heading):
              raise SystemExit('unexpected changelog heading')
          entry = (
              '\n## 0.6.0-alpha.1\n\n'
              '- Adds the visible-browser autonomous development orchestrator with durable\n'
              '  Project, planner, worker, and repository workflow state, exact conversation\n'
              '  continuity, independent tester evidence, exact-SHA review gates, and\n'
              '  fail-closed recovery across uncertain browser operations.\n'
              '- Adds first-class GitHub cloud development with Codespaces and an optional\n'
              '  Rust build/test gate, while keeping the Node runtime authoritative and Python\n'
              '  as the parity protocol client.\n'
              '- Adds compiled GitHub npm distribution, an installed `chatgpt-thread` CLI,\n'
              '  Project-scoped first-send parity, hardened cross-platform stream cancellation,\n'
              '  audited dependency updates, and release metadata for this repository fork.\n'
          )
          changelog.write_text(heading + entry + text[len(heading):], encoding='utf-8')
          PY

      - name: Verify coordinated release identity
        run: npm run release:check-version -- --tag v0.6.0-alpha.1

      - name: Verify lockfile and dependency audit
        run: |
          npm --prefix packages/node ci
          npm --prefix packages/node audit

      - name: Commit verified version bump
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json packages/node/package.json packages/node/package-lock.json packages/python/pyproject.toml plugins/codex-chatgpt-control/.codex-plugin/plugin.json CHANGELOG.md
          git commit -m "release: bump development orchestrator to 0.6.0-alpha.1"
          git push origin HEAD:chatgpt-dev-orchestrator
