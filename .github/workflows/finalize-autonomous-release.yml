name: finalize-autonomous-release

on:
  push:
    branches:
      - chatgpt-dev-orchestrator
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-autonomous-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    name: finalize generated release artifacts
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt-dev-orchestrator
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Node dependencies
        run: npm --prefix packages/node ci

      - name: Harden persisted integration-state validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/node/src/dev/autonomous-snapshot.ts")
          text = path.read_text(encoding="utf-8")

          old_coherence = '''  validateIntegrationEvidenceRelations(integration, workflow.plannerConversationKey);
          if (integration.blockedFrom !== undefined) {'''
          new_coherence = '''  validateIntegrationEvidenceRelations(integration, workflow.plannerConversationKey);
          const hasIntegrationEvidence = integration.implementation !== undefined
            || integration.tester !== undefined
            || integration.push !== undefined
            || integration.plannerReview !== undefined;
          if (!allAccepted && hasIntegrationEvidence) {
            invalid("Persisted workflow contains integration evidence before every task is accepted.");
          }
          if (integration.blockedFrom !== undefined) {'''
          if text.count(old_coherence) != 1:
              raise SystemExit("expected workflow-coherence insertion point was not found exactly once")
          text = text.replace(old_coherence, new_coherence, 1)

          old_completed = '''  if (workflow.status === "completed") {
            validateEffectiveIntegrationPhase(integration, "planner_review_pending");
            if (integration.plannerReview?.status !== "accepted") {
              invalid("Completed workflow lacks exact master-planner acceptance evidence.");
            }
            return;
          }'''
          new_completed = '''  if (workflow.status === "completed") {
            requirePresent(
              integration.implementation,
              integration.tester,
              integration.push,
              integration.plannerReview,
              "Completed workflow lacks exact pushed integration and planner-review evidence."
            );
            if (integration.tester?.status !== "passed" || integration.plannerReview?.status !== "accepted") {
              invalid("Completed workflow lacks exact master-planner acceptance evidence.");
            }
            return;
          }'''
          if text.count(old_completed) != 1:
              raise SystemExit("expected completed-workflow block was not found exactly once")
          text = text.replace(old_completed, new_completed, 1)

          old_phase = '''function validateEffectiveIntegrationPhase(
            integration: DevIntegrationRecord,
            phase: DevIntegrationPhase
          ): void {
            switch (phase) {
              case "integration_ready":
                return;
              case "integration_testing":
                requirePresent(integration.implementation, "Integration testing state lacks a candidate.");
                return;
              case "integration_push_pending":
                requirePresent(integration.implementation, integration.tester, "Integration push state lacks tester evidence.");
                if (integration.tester?.status !== "passed") invalid("Integration push state requires a passing independent test.");
                return;
              case "planner_review_pending":
                requirePresent(integration.implementation, integration.tester, integration.push, "Planner review state lacks pushed integration evidence.");
                if (integration.tester?.status !== "passed") invalid("Planner review state requires a passing independent integration test.");
                return;
            }
          }'''
          new_phase = '''function validateEffectiveIntegrationPhase(
            integration: DevIntegrationRecord,
            phase: DevIntegrationPhase
          ): void {
            switch (phase) {
              case "integration_ready": {
                const hasImplementation = integration.implementation !== undefined;
                const hasTester = integration.tester !== undefined;
                const hasPush = integration.push !== undefined;
                const plannerReview = integration.plannerReview;
                if (plannerReview !== undefined) {
                  if (
                    plannerReview.status !== "revision_required"
                    || hasImplementation
                    || hasTester
                    || hasPush
                  ) {
                    invalid("Persisted integration-ready state contains incompatible planner-review evidence.");
                  }
                  return;
                }
                if (!hasImplementation && !hasTester && !hasPush) return;
                if (
                  hasImplementation
                  && integration.tester?.status === "failed"
                  && !hasPush
                ) {
                  return;
                }
                invalid("Persisted integration-ready state contains evidence that is not a valid retry state.");
              }
              case "integration_testing":
                requirePresent(integration.implementation, "Integration testing state lacks a candidate.");
                if (
                  integration.tester !== undefined
                  || integration.push !== undefined
                  || integration.plannerReview !== undefined
                ) {
                  invalid("Persisted integration-testing state contains later-phase evidence.");
                }
                return;
              case "integration_push_pending":
                requirePresent(integration.implementation, integration.tester, "Integration push state lacks tester evidence.");
                if (integration.tester?.status !== "passed") invalid("Integration push state requires a passing independent test.");
                if (integration.push !== undefined || integration.plannerReview !== undefined) {
                  invalid("Persisted integration-push-pending state contains later-phase evidence.");
                }
                return;
              case "planner_review_pending":
                requirePresent(integration.implementation, integration.tester, integration.push, "Planner review state lacks pushed integration evidence.");
                if (integration.tester?.status !== "passed") invalid("Planner review state requires a passing independent integration test.");
                if (integration.plannerReview !== undefined) {
                  invalid("Persisted planner-review-pending state already contains planner review evidence.");
                }
                return;
            }
          }'''
          if text.count(old_phase) != 1:
              raise SystemExit("expected integration-phase validator was not found exactly once")
          text = text.replace(old_phase, new_phase, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Remove duplicate Python async-client import
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/python/src/codex_chatgpt_control/async_client.py")
          text = path.read_text(encoding="utf-8")
          duplicate = "from .dev import AsyncDevClient\nfrom .dev import AsyncDevClient\n"
          if duplicate not in text:
              raise SystemExit("expected duplicate AsyncDevClient import was not found")
          text = text.replace(duplicate, "from .dev import AsyncDevClient\n", 1)
          if text.count("from .dev import AsyncDevClient") != 1:
              raise SystemExit("AsyncDevClient import cleanup was not exact")
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify focused autonomous behavior
        shell: bash
        run: |
          set -euo pipefail
          cd packages/node
          npx vitest run \
            tests/unit/dev-autonomous-snapshot-corruption.test.ts \
            tests/unit/dev-autonomous-store.test.ts \
            tests/unit/dev-autonomous-recovery-invariants.test.ts \
            tests/unit/dev-autonomous-blocker-recoverability.test.ts \
            tests/unit/dev-codex-cli-test-hygiene.test.ts \
            tests/unit/environment.test.ts

      - name: Compile Python source
        run: python -m compileall -q packages/python/src packages/python/tests

      - name: Build SDK and regenerate plugin runtime
        shell: bash
        run: |
          set -euo pipefail
          npm run node:build
          npm run plugin:build
          npm run plugin:check
          npm run plugin:validate
          npm run release:check-node-pack

      - name: Commit exact generated release state and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            packages/node/src/dev/autonomous-snapshot.ts \
            packages/python/src/codex_chatgpt_control/async_client.py \
            plugins/codex-chatgpt-control/runtime
          git rm .github/workflows/finalize-autonomous-release.yml
          git diff --cached --check
          git commit -m "build: finalize autonomous release runtime"
          git push origin HEAD:chatgpt-dev-orchestrator
