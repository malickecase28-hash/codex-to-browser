name: rust-cloud

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/rust-cloud.yml"
      - ".devcontainer/**"
  push:
    branches:
      - main
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/rust-cloud.yml"
      - ".devcontainer/**"
  workflow_dispatch:

jobs:
  rust-cloud:
    name: rust cloud build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect Rust manifests
        id: rust
        shell: bash
        run: |
          mapfile -t manifests < <(find . -name Cargo.toml -not -path './.git/*' -print | sort)
          if (( ${#manifests[@]} == 0 )); then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No Rust workspace or crate is present yet. Cloud Rust tooling is ready when one is added."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            printf 'Detected Rust manifests:\n%s\n' "${manifests[*]}"
          fi

      - name: Install stable Rust toolchain
        if: steps.rust.outputs.present == 'true'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
          rustc --version
          cargo --version

      - name: Format, build, and test every Rust manifest
        if: steps.rust.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find . -name Cargo.toml -not -path './.git/*' -print | sort)
          for manifest in "${manifests[@]}"; do
            crate_dir="$(dirname "$manifest")"
            echo "::group::Rust validation: $manifest"
            cargo fmt --manifest-path "$manifest" --all -- --check
            if [[ -f "$crate_dir/Cargo.lock" ]]; then
              cargo build --release --locked --manifest-path "$manifest"
              cargo test --locked --manifest-path "$manifest"
            else
              cargo build --release --manifest-path "$manifest"
              cargo test --manifest-path "$manifest"
            fi
            echo "::endgroup::"
          done
