name: promote-verified-hardening

on:
  push:
    branches:
      - chatgpt-dev-orchestrator
    paths:
      - ".github/workflows/promote-verified-hardening.yml"

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt-dev-orchestrator
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/node/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download verified artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/verified-hardening
          gh api repos/${{ github.repository }}/actions/artifacts/9957682558/zip > /tmp/verified-hardening.zip
          echo "a3bfa27c0351eeebf96a15ca9ccfa6cb32e3cd96ff36f0a7266b8a0cbcc0d4f8  /tmp/verified-hardening.zip" | sha256sum --check
          unzip -q /tmp/verified-hardening.zip -d /tmp/verified-hardening

      - name: Promote exact verified files
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/verified-hardening/node/src/backend/client.ts packages/node/src/backend/client.ts
          cp /tmp/verified-hardening/python/src/codex_chatgpt_control/operation_models.py packages/python/src/codex_chatgpt_control/operation_models.py
          cp /tmp/verified-hardening/python/src/codex_chatgpt_control/runner.py packages/python/src/codex_chatgpt_control/runner.py
          cp /tmp/verified-hardening/python/tests/test_project_new_target.py packages/python/tests/test_project_new_target.py
          echo "0d82910e1f79df9f087a904e3c4fbb3bb8f8689286c7eb74fa386e578a937dba  packages/node/src/backend/client.ts" | sha256sum --check
          echo "bd433c7ab2d23c31eb60140dbc9ed083bd851e74bb49e0d0fb24ce2b20005fda  packages/python/src/codex_chatgpt_control/operation_models.py" | sha256sum --check
          echo "be2d0dbe13ad05142abc723d118c9d45c8b67b65fc920655fe9d83bdb2da51cf  packages/python/src/codex_chatgpt_control/runner.py" | sha256sum --check
          echo "ed43488287d17ef827cd92984213aeae40e75c92d88e2897a35558cd56715384  packages/python/tests/test_project_new_target.py" | sha256sum --check

      - name: Normalize lockfile formatting only
        working-directory: packages/node
        run: node -e "const fs=require('node:fs'); const p='package-lock.json'; const x=JSON.parse(fs.readFileSync(p,'utf8')); fs.writeFileSync(p, JSON.stringify(x,null,2)+'\n');"

      - name: Recheck promoted Node patch
        working-directory: packages/node
        run: |
          npm ci
          npx vitest run tests/unit/backend-client.test.ts
          npm run build
          npm audit

      - name: Recheck promoted Python patch
        working-directory: packages/python
        run: |
          python -m pip install -e ".[dev]"
          python -m unittest tests.test_project_new_target
          python -m pyright src tests

      - name: Commit promoted files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/node/src/backend/client.ts packages/node/package-lock.json packages/python/src/codex_chatgpt_control/operation_models.py packages/python/src/codex_chatgpt_control/runner.py packages/python/tests/test_project_new_target.py
          git commit -m "fix: promote verified cross-platform hardening"
          git push origin HEAD:chatgpt-dev-orchestrator
