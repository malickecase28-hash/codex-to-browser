name: rebuild-plugin-runtime

on:
  push:
    branches:
      - chatgpt-dev-orchestrator
    paths:
      - ".github/workflows/rebuild-plugin-runtime.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt-dev-orchestrator
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json

      - name: Install Node dependencies
        run: npm --prefix packages/node ci

      - name: Rebuild plugin runtime from Node source
        run: npm run plugin:build

      - name: Verify generated plugin runtime
        run: |
          npm run plugin:validate
          npm run plugin:check
          git diff --check -- plugins/codex-chatgpt-control/runtime

      - name: Commit generated plugin runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/codex-chatgpt-control/runtime
          if git diff --cached --quiet; then
            echo "Plugin runtime was already current."
            exit 0
          fi
          git commit -m "build: refresh Codex plugin runtime bundles"
          git push origin HEAD:chatgpt-dev-orchestrator
