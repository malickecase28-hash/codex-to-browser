name: release-readiness

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-readiness:
    name: verify plugin and distributable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: packages/node/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node dependencies
        run: npm --prefix packages/node ci

      - name: Install Python release tooling
        run: python -m pip install --upgrade build twine

      - name: Build compiled Node package
        run: |
          npm run node:build
          npm run node:bundle

      - name: Verify package identity and dependency audit
        run: |
          npm run release:check-names
          npm run release:check-node-pack
          npm --prefix packages/node audit

      - name: Verify Codex plugin layout and generated runtime
        run: |
          npm run plugin:validate
          npm run plugin:check

      - name: Build and verify Python distributions
        run: |
          rm -rf dist/python
          npm run release:build-python
          npm run release:check-python

      - name: Verify source installation smoke
        run: npm run release:smoke-source
